# ============================================================
#  Portal cautivo Byte
#  podman compose -f docker/docker-compose.yaml up -d --build
# ============================================================

name: byte-portal

# Sin pod: cada servicio publica su puerto con rootlessport; en un pod, si el contenedor
# infra cae, los puertos quedan sin publicar
x-podman:
  in_pod: false

services:
  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: byte-portal:latest
    container_name: byte-portal
    environment:
      - REDIRECT=${REDIRECT:-}
      - NETWORK_NAME=${NETWORK_NAME:-}
      - TIMEZONE=${TIMEZONE:-}
      # Hora local que define el día (por defecto 02:00)
      - RESET_AT=${RESET_AT:-}
    volumes:
      # Base SQLite: visitantes y registro de accesos del evento
      - portal_data:/data
    ports:
      - '0.0.0.0:${PORTAL_PORT:-8080}:8080'
    restart: always
    stop_grace_period: 10s
    # Se repite aquí porque podman construye en formato OCI, que descarta el HEALTHCHECK del Dockerfile
    healthcheck:
      test: ['CMD', '/app/byte-api', 'health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  portal_data:
