openapi: 3.2.0
info:
  title: Portal cautivo Byte API
  version: 1.1.0
  license:
    name: Propietario
    identifier: UNLICENSED
  description: |
    API del portal cautivo del Wi-Fi de invitados de Byte: el visitante deja sus datos y recibe internet
    durante 30 minutos. No hay código de verificación ni envío por WhatsApp

    El mismo proceso sirve el portal compilado (`apps/web/dist`) en `/` y en `/index.html`, desde el mismo
    origen: no hay CORS salvo que `CORS_ORIGIN` lo active para una página alojada en otro dominio

    ---

    ### Flujo

    1. **Datos** — `POST /api/send` con nombre, cédula, empresa y teléfono
    2. **Acceso** — la API autoriza la IP del dispositivo en OPNsense por 30 minutos y responde `verified: true`
    3. **Vencimiento** — al cumplirse los 30 minutos, OPNsense corta la sesión; para seguir navegando hay que volver a enviar el formulario

    ---

    ### Consideraciones generales

    * **Dispositivo:** se identifica por la IP de la conexión. Si la conexión llega desde `127.0.0.1` (el proxy
      `lighttpd` del portal en OPNsense), la IP real se toma de `X-Real-Ip` o de la primera IP de `X-Forwarded-For`,
      solo si es válida. Desde cualquier otra IP esas cabeceras se ignoran
    * **MAC:** la API la pide al router por ARP. Si el router no la conoce, el acceso se registra sin MAC
    * **Formatos:** teléfono en E.164, cédula con su letra (`V` o `E`). Las horas se guardan en la base en ISO 8601 UTC
    * **Envíos:** cada `POST /api/send` abre una sesión nueva de 30 minutos; no hay límite de envíos ni espera entre envíos
    * **Errores:** cuerpo `{"error": "<código>"}`; lo que importa es el código HTTP
    * **Métodos:** una ruta que existe con otro método responde 405 y la cabecera `Allow` dice cuáles admite

servers:
  - url: http://localhost:8080
    description: Desarrollo (`make api`)
tags:
  - name: Acceso
    description: Datos del visitante y acceso a internet
  - name: Sistema
    description: Salud del servicio
paths:
  /api/send:
    post:
      summary: Registrar al visitante y abrir la sesión
      description: |
        Valida los datos, guarda al visitante y autoriza la IP en OPNsense por 30 minutos. Siempre responde
        `verified: true` cuando la sesión queda abierta; el portal entonces muestra "Conectado"
      operationId: send
      tags: [Acceso]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '200':
          description: Sesión abierta por 30 minutos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
              example:
                verified: true
                redirect: https://www.byteservices.net/
        '400':
          $ref: '#/components/responses/Invalid'
        '405':
          description: La ruta solo admite `POST`
          headers:
            Allow:
              description: Métodos que admite la ruta
              schema:
                type: string
              example: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: method_not_allowed
        '500':
          $ref: '#/components/responses/Internal'

  /api/health:
    get:
      summary: Liveness del proceso
      description: Responde mientras el proceso HTTP esté escuchando. Lo usa el healthcheck del contenedor (`captiveportal health`)
      operationId: getHealth
      tags: [Sistema]
      responses:
        '204':
          description: Proceso activo
        '405':
          description: La ruta solo admite `GET` y `HEAD`
          headers:
            Allow:
              description: Métodos que admite la ruta
              schema:
                type: string
              example: GET, HEAD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: method_not_allowed

components:
  schemas:
    Phone:
      type: string
      description: Teléfono en E.164
      pattern: '^\+[1-9]\d{7,14}$'
      examples: ['+584125551234']

    SendRequest:
      type: object
      required: [name, id_number, company, phone]
      properties:
        name:
          type: string
          description: Nombre y apellido; al menos dos palabras. Los espacios repetidos se normalizan
          maxLength: 100
          examples: ['María González']
        id_number:
          type: string
          description: Cédula con su letra, sin puntos
          pattern: '^[VE]\d{6,8}$'
          examples: ['V18456789']
        company:
          type: string
          description: Empresa donde trabaja el visitante; entre 2 y 100 caracteres. Los espacios repetidos se normalizan
          minLength: 2
          maxLength: 100
          examples: ['Inversiones Demo']
        phone:
          $ref: '#/components/schemas/Phone'

    SendResponse:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
          description: Siempre `true` cuando la sesión queda abierta
        redirect:
          type: string
          format: uri
          description: Enlace de "Empezar a navegar" (`REDIRECT`); ausente si no está configurado

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid, method_not_allowed, internal]

  responses:
    Invalid:
      description: JSON mal formado o datos con formato inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid
    Internal:
      description: Error interno (base de datos o router); el detalle queda en el log
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal
