# ============================================================
#  Portal cautivo Byte - CI
#  Quality gate en jobs paralelos: secretos, portal (JS), API (Go) y repo (shell, Dockerfile,
#  workflows, Terraform). Igual en PR y en push a main.
#  Sin imagen, CD ni registro: el portal se despliega a mano en el equipo de la red local.
#  En local corre lo mismo `task check` (hook pre-push).
#  Ver docs/explanation/ops/ci.md
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --only-verified

  web:
    name: Portal (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: la toma de packageManager en package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dependencias: vulnerabilidades conocidas y firmas del registro
      - run: pnpm audit:deps
      - run: pnpm audit:signatures

      # oxlint, oxfmt, ES2020 y build con presupuesto de peso
      - run: pnpm check

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            tools/go.sum
            tools/actionlint/go.sum

      # task sale de tools/go.mod: la misma versión que en local
      - name: Install task
        run: |
          cd tools && go build -o "$GITHUB_WORKSPACE/.bin/" github.com/go-task/task/v3/cmd/task
          echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"

      # go mod tidy/verify, golangci-lint (lint + formato), go vet, tests con -race y govulncheck
      - run: task check:api

  repo:
    name: Repo (shell, Dockerfile, workflows, Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Con CI=true, si falta una herramienta del sistema el job falla en vez de saltarse el chequeo
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            tools/go.sum
            tools/actionlint/go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.x'
          terraform_wrapper: false

      - name: Install task
        run: |
          cd tools && go build -o "$GITHUB_WORKSPACE/.bin/" github.com/go-task/task/v3/cmd/task
          echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"

      # hadolint no viene en el runner: la acción lo corre en su contenedor
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile

      # shellcheck viene en el runner (actionlint también lo usa sobre los `run:` de los workflows)
      - run: task repo:shell repo:actions repo:tf
